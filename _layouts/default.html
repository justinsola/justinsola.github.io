<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="preload" href="{{ '/assets/fonts/SourceSerif4-regular.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{ '/assets/fonts/SourceSerif4-italic.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>

<link rel="icon" type="image/svg+xml" href="{{ '/favicon.svg' | relative_url }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ '/favicon-32.png' | relative_url }}">
<link rel="apple-touch-icon" sizes="180x180" href="{{ '/favicon-180.png' | relative_url }}">


<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
<style>
  #skip-to-content { position: absolute; left: 8px; top: -40px; background: var(--navy, #1B3D6D); color: #fff; padding: 8px 14px; font-family: inherit; font-size: .875rem; z-index: 100; text-decoration: none; border-radius: 0 0 3px 3px; }
  #skip-to-content:focus { top: 0; }
</style>

{% seo title=false %}
<title>{{ page.title | default: site.title }}</title>

{% if jekyll.environment == 'production' %}
{% include google-analytics.html %}
{% endif %}
</head>
<body>

<a id="skip-to-content" href="#content">Skip to the content.</a>

<header class="topline">
 <div class="topline-inner">
  <a class="mark" href="{{ '/' | relative_url }}">Justin L. Sola</a>
  <nav class="primary" aria-label="Main navigation">
    <a {% if page.nav == 'research' %}class="current" aria-current="page" {% endif %}href="{{ '/' | relative_url }}">Research</a>
    <a {% if page.nav == 'about' %}class="current" aria-current="page" {% endif %}href="{{ '/about.html' | relative_url }}">About</a>
    <a {% if page.nav == 'gun_desirability' %}class="current" aria-current="page" {% endif %}href="{{ '/gun_desirability.html' | relative_url }}">Gun desirability</a>
    <a href="{{ '/files/Sola_CV.pdf' | relative_url }}">CV</a>
    <a href="mailto:jlsola@unc.edu">Email</a>
  </nav>
 </div>
</header>

<main id="content">
{{ content }}

  <p class="copyright">&copy; 2026 Justin Lucas Sola</p>
</main>

</body>
</html>
